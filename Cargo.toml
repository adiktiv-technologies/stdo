[package]
name = "stdo"
version = "0.5.5"
edition = "2021"
description = "⚡ Standard I/O Orchestrator — Zero-network Unix DAG workflow engine in Rust with an embedded Studio UI."
license = "Apache-2.0"
repository = "https://github.com/adiktiv-technologies/stdo"
homepage = "https://github.com/adiktiv-technologies/stdo"
readme = "README.md"
keywords = ["workflow", "dag", "orchestrator", "cli", "unix"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["AGENTS.md", ".github/", ".claude/", "release-plz.toml", "assets/", "benchmarks/"]

[dependencies]
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
minijinja = { version = "2", default-features = false, features = ["builtins", "serde", "std_collections"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "fs", "time", "net"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
