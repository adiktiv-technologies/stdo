version: "1.0"
name: ollama-gemma4-phonon-speech
description: Generate a short answer with Ollama and stream Phonon's WAV output to disk.

inputs:
  llm_model: { type: string, default: gemma4 }
  tts_model: { type: string, default: phonon }
  prompt: { type: string, default: "Tell me a fun fact about owls in two sentences." }
  output_wav: { type: path, default: /tmp/stdo-owl-fact.wav }

steps:
  - id: ask_gemma
    cmd: [ollama, run, "{{ inputs.llm_model }}", --hidethinking, "{{ inputs.prompt }}"]
    timeout_ms: 60000
    retry: { attempts: 2, backoff_ms: 500 }

  - id: stream_phonon
    cmd: [ollama, run, "{{ inputs.tts_model }}"]
    pipe_from: ask_gemma
    capture_stdout: false

  - id: stage_wav
    cmd:
      - sh
      - -c
      - |
        set -eu
        case "$1" in /*) target=$1 ;; *) target=./$1 ;; esac
        tmp="$target.tmp.$$"
        umask 077
        (set -C; : > "$tmp")
        trap 'rm -f "$tmp"' 0
        trap 'exit 1' HUP INT TERM
        cat > "$tmp"
        printf '%s\n' "$$"
        trap - 0 HUP INT TERM
      - stage-wav
      - "{{ inputs.output_wav }}"
    pipe_from: stream_phonon

  - id: write_wav
    cmd:
      - sh
      - -c
      - |
        set -eu
        case "$1" in /*) target=$1 ;; *) target=./$1 ;; esac
        IFS= read -r pid
        case "$pid" in ''|*[!0-9]*) exit 1 ;; esac
        tmp="$target.tmp.$pid"
        trap 'rm -f "$tmp"' 0
        trap 'exit 1' HUP INT TERM
        bytes=$(wc -c < "$tmp")
        [ ! -d "$target" ]
        mv -f "$tmp" "$target"
        printf '%s\n' "$bytes"
      - write-wav
      - "{{ inputs.output_wav }}"
    stdin: |
      {{ steps.stage_wav.stdout | trim }}
      {# The dependency below waits for Phonon's successful exit as well. #}
      {{ steps.stream_phonon.exit_code }}

output: |
  Wrote {{ steps.write_wav.stdout | trim }} bytes to {{ inputs.output_wav }}
