name: Release Binaries

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to rebuild (leave blank to test the selected ref)"
        type: string
        required: false

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG != '' && format('refs/tags/{0}', env.RELEASE_TAG) || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl-tools on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build static release binary
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package archive
        id: package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          archive="stdo-${RELEASE_TAG:-$GITHUB_SHA}-$TARGET.tar.gz"
          tar -czf "$archive" -C "target/$TARGET/release" stdo
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Upload to GitHub Release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ steps.package.outputs.archive }}
          generate_release_notes: true
      - name: Upload test build
        if: env.RELEASE_TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: stdo-${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}
