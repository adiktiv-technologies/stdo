name: Release Binaries

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl-tools on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu
      - name: Build static release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package archive
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../stdo-${{ github.ref_name }}-${{ matrix.target }}.tar.gz stdo
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: stdo-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          generate_release_notes: true