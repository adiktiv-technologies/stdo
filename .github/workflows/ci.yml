name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  platform-checks:
    name: Check, Clippy & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy (strict)
        run: cargo clippy --all-targets -- -D warnings
      - name: Build release binary & check size
        run: |
          cargo build --release
          ls -lh target/release/stdo
      - name: Run tests
        run: cargo test --verbose
      - name: Check Studio behavior
        run: node --test tests/studio_behavior_test.js

  check-and-test:
    name: check-and-test
    needs: platform-checks
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all platform checks to pass
        env:
          PLATFORM_RESULT: ${{ needs.platform-checks.result }}
        run: test "$PLATFORM_RESULT" = success
