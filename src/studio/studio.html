<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stdo Studio</title>
<style>
:root{color-scheme:dark;--canvas:#111827;--panel:#151d2c;--bar:#0d1422;--line:#303c51;--text:#e8edf6;--muted:#a8b5ca;--pipe:#6ee7c8;--template:#c1adff;--branch:#f4c079;--error:#ff9c9c;--mono:ui-monospace,SFMono-Regular,Consolas,monospace;font:14px system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bar);color:var(--text)}button,input,select,textarea{font:inherit;color:inherit}button,select,input,textarea{background:#1a2538;border:1px solid var(--line);border-radius:6px;padding:7px 9px}button,select{cursor:pointer}button:hover{border-color:var(--muted)}button:disabled{opacity:.5;cursor:wait}:focus-visible{outline:2px solid var(--pipe);outline-offset:2px}.primary{background:var(--pipe);color:#10251f;border-color:var(--pipe);font-weight:700}.danger{color:var(--error)}.quiet{color:var(--muted)}
#toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}.brand{font:700 20px var(--mono);margin-right:10px}.brand span{color:var(--muted);font:500 14px system-ui}.toolbar-group{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.toolbar-group:last-child{margin-left:auto}#files{max-width:245px}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,29vw);height:calc(100dvh - 64px);min-height:440px}#workspace{min-width:0;display:flex;flex-direction:column;min-height:0}.canvas-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--panel)}.canvas-bar strong{font-family:var(--mono)}.legend{display:flex;gap:10px;color:var(--muted);font-size:12px}.legend i{display:inline-block;width:10px;height:3px;margin-right:4px;vertical-align:middle;background:var(--edge)}.pipe{--edge:var(--pipe)}.template{--edge:var(--template)}.branch{--edge:var(--branch)}#viewport{flex:1;overflow:auto;background:radial-gradient(circle,#34435d 1px,transparent 1.4px) 0 0/21px 21px,var(--canvas)}
#stage{position:relative;min-width:100%;min-height:100%}#edges-layer,#nodes-layer,#layers{position:absolute;inset:0;width:100%;height:100%}#nodes-layer,#layers,#edges-layer{pointer-events:none}.layer-label{position:absolute;color:var(--muted);font:12px var(--mono);width:228px;padding-bottom:7px;border-bottom:1px solid #3c4d68}.edge{fill:none;stroke:var(--edge);stroke-width:2;opacity:.85}.edge-hit{fill:none;stroke:transparent;stroke-width:15;pointer-events:stroke;cursor:pointer}.edge-hit:hover+.edge,.edge-hit:focus+.edge{stroke:var(--error);stroke-width:3;opacity:1}.wire-preview{fill:none;stroke:var(--text);stroke-dasharray:4 5;stroke-width:2}.node{position:absolute;width:228px;height:108px;pointer-events:auto;background:#192437;border:1px solid #465775;border-radius:9px;box-shadow:0 6px 12px #060a1455}.node.selected{outline:2px solid var(--template);outline-offset:3px}.node[data-result=passed]{border-color:var(--pipe)}.node[data-result=failed]{border-color:var(--error)}.node[data-result=skipped]{opacity:.64}.node[data-result=cached]{border-color:var(--template)}.node header{cursor:grab;touch-action:none;display:flex;gap:8px;align-items:center;padding:9px 11px;border-bottom:1px solid var(--line)}.node header:active{cursor:grabbing}.node header button{margin-left:auto;padding:2px 6px;font-size:11px}.node header strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:600 13px var(--mono)}.node .kind{font:11px var(--mono);color:var(--pipe)}.node.switch .kind{color:var(--branch)}.node .summary,.node .badge{display:block;margin:8px 11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font:12px var(--mono);color:var(--muted)}.node .badge{color:var(--text);font-size:11px}.port{position:absolute;top:47px;width:13px;height:13px;padding:0;border:2px solid #182235;background:var(--pipe);border-radius:50%;cursor:crosshair}.port.in{left:-7px}.port.out{right:-7px}.port:hover{background:#fff}.port.armed{outline:2px solid var(--text)}
#yaml-panel{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-left:1px solid var(--line)}.tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--line)}.tabs button{flex:1;background:transparent}.tabs [aria-selected=true]{background:#29354a;border-color:#546485}.pane{padding:14px;overflow:auto;flex:1}.pane[hidden]{display:none}.pane h2{font-size:15px;margin:0 0 12px}.pane h3{font-size:13px;margin:16px 0 8px}.field{display:grid;gap:4px;margin:0 0 10px;color:var(--muted);font-size:12px}.field input,.field select,.field textarea{width:100%;color:var(--text);font:12px var(--mono)}.field input[type=checkbox]{width:auto;justify-self:start}.field textarea{min-height:65px;resize:vertical}.input-card{border-top:1px solid var(--line);padding-top:11px;margin-top:12px}.input-card button{font-size:12px}#yaml{display:block;width:100%;height:calc(100% - 56px);min-height:230px;resize:vertical;font:12px/1.5 var(--mono);tab-size:2}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.45 var(--mono);background:var(--bar);padding:9px;border:1px solid var(--line);border-radius:6px}#notice{min-height:35px;padding:8px 13px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);overflow-wrap:anywhere}#notice[data-tone=error]{color:var(--error)}#notice[data-tone=success]{color:var(--pipe)}
@media(max-width:820px){main{height:auto;grid-template-columns:1fr}#workspace{height:60dvh}#yaml-panel{min-height:400px;border-left:0;border-top:1px solid var(--line)}#toolbar .toolbar-group:last-child{margin-left:0}.legend{display:none}}
.node[data-result=running]{border-color:#73aaff;animation:running-pulse 1.5s ease-in-out infinite}
.node[data-result=running] .badge{color:#a8caff}
.run-spinner{display:inline-block;width:.85em;height:.85em;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;vertical-align:-.08em;animation:run-spin .75s linear infinite}
#run[aria-busy=true]{display:inline-flex;align-items:center;gap:8px;opacity:1;font-variant-numeric:tabular-nums}
.node[data-result=running] .badge{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
@keyframes run-spin{to{transform:rotate(1turn)}}
@keyframes running-pulse{50%{box-shadow:0 0 16px #73aaff99}0%,100%{box-shadow:0 0 4px #73aaff44}}
@media(prefers-reduced-motion:reduce){.run-spinner,.node[data-result=running]{animation:none}}
#disk-notice{color:var(--branch);padding:8px 13px;font-size:12px}
.run-progress{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px;padding:9px 11px;border-inline-start:3px solid #73aaff;background:var(--bar);color:#a8caff}
.run-progress[hidden]{display:none}
.run-elapsed{font:12px var(--mono);font-variant-numeric:tabular-nums}
#live-stdout{display:grid;gap:7px}
.step-output{min-width:0;padding:8px 9px;border:1px solid var(--line);border-radius:6px}
.step-output strong{font:600 12px var(--mono)}
.step-output pre{max-height:200px;overflow:auto;margin:5px 0 0}
.binary-preview{display:block;margin-top:5px;color:var(--template);font-size:12px;overflow-wrap:anywhere}
.workflow-output audio{display:block;width:100%;margin:8px 0 4px}
.workflow-output video{display:block;width:100%;max-height:260px;border-radius:8px;background:#000;margin:8px 0 4px}
.workflow-output a{color:var(--pipe);overflow-wrap:anywhere}
.command-builder{margin:0 0 14px}
.command-builder h4{margin:0 0 6px;font-size:13px}
.command-modes{display:flex;gap:2px;padding:2px;margin-bottom:8px;border:1px solid var(--line);border-radius:6px;background:var(--bar)}
.command-modes button{flex:1;background:transparent;border-color:transparent;font-size:12px}
.command-modes [aria-pressed=true]{background:#29354a;border-color:#546485}
.command-rows{display:grid;gap:5px}
.command-arg{min-width:0;padding:5px 6px;background:var(--bar);border:1px solid var(--line);border-radius:6px}
.command-arg[data-block=true]{border-inline-start:2px solid var(--template)}
.command-arg-head,.command-arg-actions,.command-footer{display:flex;align-items:center;gap:4px}
.command-arg-head{min-width:0;flex-wrap:wrap}
.command-index,.command-role,.command-lines{font:11px var(--mono)}
.command-index{color:var(--pipe)}
.command-role,.command-lines{color:var(--muted)}
.command-arg-actions{margin-left:auto}
.command-arg-actions button,.command-footer button{padding:3px 5px;font-size:11px}
.command-arg-actions button:disabled{cursor:default}
.command-arg input,.command-arg textarea,.command-raw textarea{width:100%;font:12px/1.5 var(--mono);margin-top:4px;tab-size:2}
.command-arg textarea{field-sizing:content;min-height:3.5em;max-height:18em;resize:vertical}
.command-arg textarea,.command-raw textarea{display:block}
.command-arg textarea[hidden]{display:none}
.command-footer{margin-top:7px;flex-wrap:wrap}
.command-raw textarea{min-height:9em;resize:vertical}
.command-raw textarea[aria-invalid=true]{border-color:var(--error)}
.command-raw p{margin:5px 0;color:var(--error);font-size:12px}
#help{width:32px;height:32px;min-width:32px;border-radius:50%;padding:0;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.requirements-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:16px}
.requirements-table th,.requirements-table td{padding:7px 5px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);white-space:nowrap;word-break:normal;overflow-wrap:normal}
.requirements-table code{font:11px var(--mono);white-space:inherit;overflow-wrap:inherit}
.requirements-table td:last-child{white-space:normal;overflow-wrap:anywhere;min-width:160px}
.requirements-table td:last-child code{white-space:pre-wrap}
.requirements-scroll{overflow-x:auto}
.requirement-status{white-space:nowrap;font-size:11px}.requirement-status[data-ok=true]{color:var(--pipe)}.requirement-status[data-ok=false]{color:var(--error)}
.tabs button{padding:7px 4px;font-size:12px;min-width:0}
#studio-dialog{width:min(660px,94vw);max-height:85dvh;overflow:auto;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:20px}
#studio-dialog::backdrop{background:#050a16bb}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
#studio-dialog h2{margin-top:0}#studio-dialog h3{margin-bottom:6px}
#studio-dialog table{border-collapse:collapse;font-size:12px}#studio-dialog td,#studio-dialog th{border:1px solid var(--line);padding:7px;text-align:left}
</style>
</head>
<body>
<header id="toolbar">
  <div class="brand">stdo <span>Studio</span></div>
  <div class="toolbar-group">
    <select id="files" aria-label="Workflow file"></select>
    <button id="new-file">New file</button><button id="delete-file" class="danger">Delete file</button><button id="revert">Revert changes</button>
  </div>
  <div class="toolbar-group">
    <button id="add-input">+ Input</button><button id="add-command">+ Command Step</button><button id="add-switch">+ Switch Step</button>
  </div>
  <div class="toolbar-group">
    <button id="validate">Validate (Doctor)</button><button id="save">Save</button><button id="save-as">Save As…</button><button id="run" class="primary">▶ Run Workflow</button><button id="help" title="Help" aria-label="Help">?</button>
  </div>
</header>
<main>
  <section id="workspace" aria-label="Workflow canvas">
    <div class="canvas-bar">
      <strong id="workflow-title">Workflow</strong>
      <div class="legend" aria-label="Connection types"><span class="pipe"><i></i>Pipe</span><span class="template"><i></i>Template</span><span class="branch"><i></i>Branch</span></div>
      <label>Wire <select id="wire-mode"><option value="pipe">Pipe</option><option value="template">Template</option><option value="branch">Switch branch</option></select></label>
      <button id="layout">Auto-layout</button>
    </div>
    <div id="viewport">
      <div id="stage">
        <div id="layers" aria-hidden="true"></div>
        <svg id="edges-layer" aria-label="Workflow connections"></svg>
        <div id="nodes-layer"></div>
      </div>
    </div>
  </section>
  <aside id="yaml-panel" aria-label="Workflow inspector">
    <nav class="tabs" aria-label="Inspector views">
      <button data-tab="requirements" aria-selected="false">Requirements</button><button data-tab="edit" aria-selected="true">Edit</button><button data-tab="yaml" aria-selected="false">YAML</button><button data-tab="inspect" aria-selected="false">Run inspector</button>
    </nav>
    <section id="requirements" class="pane" hidden><h2>Requirements</h2><div id="requirement-items">Load a workflow to inspect requirements.</div></section>
    <section id="edit" class="pane"></section>
    <section id="yaml-view" class="pane" hidden>
      <h2>Workflow YAML</h2><button id="apply-yaml">Apply to canvas</button>
      <p class="quiet">Edit YAML directly or update it from the canvas.</p>
      <textarea id="yaml" aria-label="Workflow YAML" spellcheck="false"></textarea>
    </section>
    <section id="inspect" class="pane" hidden>
      <h2>Run workflow</h2><div id="overrides"></div>
      <label><input id="no-cache" type="checkbox"> Bypass step cache</label>
      <div id="results"><p class="quiet">Run the workflow to inspect its output and timings.</p></div>
    </section>
    <div id="disk-notice" role="status" hidden></div>
    <div id="notice" role="status" aria-live="polite">Loading workflows…</div>
  </aside>
</main>
<dialog id="studio-dialog" aria-labelledby="dialog-title"></dialog>
<script>
'use strict';
const $ = id => document.getElementById(id);
const svgNS = 'http://www.w3.org/2000/svg';
const state = {
  workflow: null, path: '', paths: [], layers: [], positions: new Map(), pinned: new Set(), selected: null,
  dirty: false, raw: false, revision: 0, timer: null, pending: null, drag: null,
  results: new Map(), saved: false, fileRequest: 0, loading: false, diskHash: null, polling: false
};
const STEP_ID = /^[A-Za-z_][A-Za-z0-9_]*$/;
const STEP_REFERENCE = /steps\.([A-Za-z_][A-Za-z0-9_]*)\./g;
const TEMPLATE_EXPRESSION = /\{\{[\s\S]*?\}\}/g;
const NODE_WIDTH = 228;
const COLUMN = 292;
const ROW = 140;

function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  return node;
}
function button(text, action, className) {
  const node = element('button', text, className);
  node.addEventListener('click', action);
  return node;
}
function notice(text, tone = '') {
  $('notice').textContent = text;
  $('notice').dataset.tone = tone;
}
function tab(name) {
  for (const control of document.querySelectorAll('[data-tab]')) {
    const active = control.dataset.tab === name;
    control.setAttribute('aria-selected', String(active));
    $(control.dataset.tab === 'yaml' ? 'yaml-view' : control.dataset.tab).hidden = !active;
  }
}
async function api(path, method = 'GET', body) {
  const options = {method};
  if (body !== undefined) {
    options.headers = {'Content-Type': 'application/json'};
    options.body = JSON.stringify(body);
  }
  let response;
  try { response = await fetch(path, options); }
  catch {
    throw new TypeError('Studio server unreachable — make sure "stdo serve" is running');
  }
  const result = await response.json();
  if (!response.ok) {
    const error = new Error(result.error || 'Studio request failed');
    error.status = response.status;
    throw error;
  }
  return result;
}
const fileUrl = path => '/api/workflow?path=' + encodeURIComponent(path);
const empty = () => ({version:'1.0',name:'Untitled workflow',inputs:{},steps:[]});
const payload = () => state.raw ? {yaml:$('yaml').value} : {workflow:state.workflow};

function refreshFiles() {
  $('files').replaceChildren();
  const paths = [...new Set([...state.paths, state.path].filter(Boolean))].sort();
  for (const path of paths) {
    const option = element('option', path);
    option.value = path;
    option.selected = path === state.path;
    $('files').append(option);
  }
  $('delete-file').disabled = !state.saved;
}
function replaceFile(path, data, saved) {
  state.revision++;
  clearTimeout(state.timer);
  state.path = path;
  state.workflow = data.workflow;
  state.layers = data.layers || [];
  state.positions.clear();
  state.pinned.clear();
  state.results.clear();
  state.pending = null;
  state.selected = null;
  state.raw = false;
  state.saved = saved;
  state.diskHash = saved ? data.sha256 : null;
  renderRequirements(data.requirements);
  diskNotice('');
  state.dirty = !saved;
  $('yaml').value = data.yaml || '';
  $('results').replaceChildren(element('p', 'Run the workflow to inspect its output and timings.', 'quiet'));
  refreshFiles();
  render();
  if (saved) {
    notice(data.doctor.ok ? 'Doctor passed' : data.doctor.error, data.doctor.ok ? 'success' : 'error');
  } else {
    updatePreview();
  }
}
async function loadFile(path) {
  const request = ++state.fileRequest;
  state.loading = true;
  try {
    const data = await api(fileUrl(path));
    if (request === state.fileRequest) replaceFile(path, data, true);
    return true;
  } catch (error) {
    if (request !== state.fileRequest) return;
    if (error.status === 404) replaceFile(path, {workflow:empty()}, false);
    else { refreshFiles(); notice(error.message, 'error'); }
    return error.status === 404;
  } finally {
    if (request === state.fileRequest) state.loading = false;
  }
}
async function start() {
  const data = await api('/api/workflows');
  state.paths = data.workflows;
  await loadFile(data.selected || 'stdo.yaml');
}
function diskNotice(message) {
  $('disk-notice').textContent = message;
  $('disk-notice').hidden = !message;
}
async function pollDisk() {
  if (!state.saved || state.loading || state.polling || $('studio-dialog').open || $('save').disabled || $('run').disabled) return;
  state.polling = true;
  const path = state.path;
  const revision = state.revision;
  const request = state.fileRequest;
  const current = () => path === state.path && request === state.fileRequest;
  const editing = () => $('edit').contains(document.activeElement) &&
    document.activeElement.matches('input, textarea, select');
  try {
    const meta = await api('/api/workflow/meta?path=' + encodeURIComponent(path));
    if (!current()) return;
    if (meta.sha256 === state.diskHash) {
      try {
        const requirements = await api('/api/doctor','POST',{...payload(),inputs:[...inputOverrides].map(([name,value]) => name+'='+value)});
        if (current()) renderRequirements(requirements);
      } catch { /* Draft validation errors are shown by the preview request. */ }
      return diskNotice('');
    }
    if (state.dirty || editing()) return diskNotice('This file changed on disk. Your draft is still open.');
    const data = await api(fileUrl(path));
    if (!current() || revision !== state.revision || state.dirty || editing() ||
        $('save').disabled || $('run').disabled || state.drag) return;
    replaceFile(path, data, true);
    notice('Reloaded ' + path + ' from disk' + (data.doctor.ok ? '.' : ' · ' + data.doctor.error),
      data.doctor.ok ? 'success' : 'error');
  } catch (error) {
    if (current() && !(error instanceof TypeError) && ![502,503,504].includes(error.status)) {
      diskNotice('Cannot reload from disk: ' + error.message);
    }
  } finally {
    state.polling = false;
  }
}
function updatePreview() {
  clearTimeout(state.timer);
  const revision = ++state.revision;
  const raw = state.raw;
  const draft = payload();
  state.timer = setTimeout(async () => {
    try {
      const data = await api('/api/preview', 'POST', draft);
      if (revision !== state.revision) return;
      if (raw) {
        state.workflow = data.workflow;
        if (!state.workflow.steps.some(step => step.id === state.selected)) state.selected = null;
      } else {
        $('yaml').value = data.yaml;
      }
      updateLayout(data.layers);
      renderRequirements(data.requirements);
      if (!state.drag) render(raw);
      notice(data.graph_error || 'Draft updated', data.graph_error ? 'error' : '');
    } catch (error) {
      if (revision === state.revision) notice(error.message, 'error');
    }
  }, 160);
}
function changed(redrawEditor = true) {
  state.raw = false;
  state.dirty = true;
  state.results.clear();
  render(redrawEditor);
  updatePreview();
}
function editAllowed() {
  if (!state.workflow || state.loading) return false;
  if (state.raw) {
    notice('Apply the YAML draft before editing the canvas.', 'error');
    tab('yaml');
    return false;
  }
  return true;
}
function currentStep(id) {
  return state.workflow.steps.find(step => step.id === id);
}
function selectStep(id) {
  state.selected = id;
  tab('edit');
  render();
}
function defaultPosition(index) {
  for (let column = 0; column < state.layers.length; column++) {
    const row = state.layers[column].indexOf(index);
    if (row !== -1) return {x:24+column*COLUMN,y:52+row*ROW};
  }
  const column = Math.max(1, state.layers.length);
  return {x:24+column*COLUMN,y:52+index*ROW};
}
function position(step, index) {
  if (!state.positions.has(step.id)) state.positions.set(step.id, defaultPosition(index));
  return state.positions.get(step.id);
}
function updateLayout(layers) {
  state.layers = layers;
  const ids = new Set(state.workflow.steps.map(step => step.id));
  for (const id of state.positions.keys()) {
    if (!ids.has(id)) state.pinned.delete(id);
    if (!state.pinned.has(id)) state.positions.delete(id);
  }
}
function placeNode(card, point) {
  card.style.transform = 'translate(' + point.x + 'px, ' + point.y + 'px)';
}
function render(redrawEditor = true) {
  if (!state.workflow) return;
  $('workflow-title').textContent = state.workflow.name || 'Untitled workflow';
  $('nodes-layer').replaceChildren();
  $('layers').replaceChildren();
  const knownLayers = state.layers.length || 1;
  for (let index = 0; index < knownLayers; index++) {
    const label = element('div', 'Layer ' + (index+1), 'layer-label');
    label.style.left = (24+index*COLUMN) + 'px';
    label.style.top = '16px';
    $('layers').append(label);
  }
  state.workflow.steps.forEach((step, index) => {
    const isSwitch = step.type === 'switch';
    const card = element('article', undefined, 'node' + (isSwitch ? ' switch' : '') + (state.selected === step.id ? ' selected' : ''));
    card.dataset.step = step.id;
    placeNode(card, position(step, index));
    const header = element('header');
    header.append(element('span', isSwitch ? '◇' : '▸', 'kind'), element('strong', step.id));
    header.append(button('Edit', () => selectStep(step.id)));
    header.addEventListener('pointerdown', event => startDrag(event, step, card));
    card.append(header, element('div', isSwitch ? step.condition || 'Set a condition' : (step.cmd || []).join(' '), 'summary'));

function modal(title,build) {
  const dialog = $('studio-dialog');
  if (dialog.open) return Promise.resolve(null);
  const previous = document.activeElement;
  return new Promise(resolve => {
    const heading = element('h2',title);
    heading.id = 'dialog-title';
    dialog.replaceChildren(heading);
    const finish = value => { dialog.close(); resolve(value); previous?.focus(); };
    dialog.oncancel = event => { event.preventDefault(); finish(null); };
    dialog.onclick = event => {
      const box = dialog.getBoundingClientRect();
      if (event.target === dialog && (event.clientX < box.left || event.clientX > box.right ||
          event.clientY < box.top || event.clientY > box.bottom)) finish(null);
    };
    build(dialog,finish);
    dialog.showModal();
  });
}

function cleanDiagnostics(text) {
  return text.replace(/\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)/g,'')
    .replace(/(?:\x1b\[|\x9b)[0-?]*[ -/]*[@-~]/g,'')
    .replace(/(?:\x1b\[|\x9b)[0-?]*[ -/]*$/g,'')
    .replace(/[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏⠿]/g,'')
    .replace(/\r\n?/g,'\n')
    .replace(/[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]/g,'')
    .replace(/\n[ \t]*(?:\n[ \t]*){2,}/g,'\n\n').trim();
}

async function readRunEvents(body, consume) {
  const response = await fetch('/api/run/stream',{
    method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)
  });
  if (!response.ok) {
    const data = await response.json();
    throw new Error(data.error || 'Studio run request failed');
  }
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let pending = '';
  try {
    for (;;) {
      const {value,done} = await reader.read();
      pending += decoder.decode(value,{stream:!done});
      let boundary;
      while ((boundary = pending.indexOf('\n\n')) !== -1) {
        const frame = pending.slice(0,boundary);
        pending = pending.slice(boundary+2);
        if (frame.startsWith('data: ') && !consume(JSON.parse(frame.slice(6)))) return;
      }
      if (done) throw new Error('The execution stream closed before the final result.');
    }
  } finally {
    await reader.cancel().catch(() => {});
  }
}

function liveOutput(container) {
  const cards = new Map();
  function cardFor(id) {
    if (!cards.has(id)) {
      const card = element('section',undefined,'step-output');
      const body = element('pre','Waiting for output…');
      card.append(element('strong','[' + id + ']'),body);
      container.append(card);
      cards.set(id,{body,decoder:new TextDecoder(),received:false,format:null});
    }
    return cards.get(id);
  }
  function append(id,bytes,done = false) {
    const card = cardFor(id);
    if (card.format) return;
    const text = card.decoder.decode(bytes,{stream:!done});
    if (!text) return;
    if (!card.received) card.body.textContent = '';
    card.received = true;
    card.body.append(text);
    card.body.scrollTop = card.body.scrollHeight;
  }
  function binary(id,format) {
    const card = cardFor(id);
    card.format = format;
    const summary = element('span','📦 Binary stream (' + format + ')','binary-preview');
    card.body.replaceWith(summary);
    card.body = summary;
  }
  function finish(step) {
    if (!cards.has(step.id) && !step.stdout_bytes) return;
    const card = cardFor(step.id);
    if (card.format) {
      card.body.textContent = '📦 Binary stream (' + card.format + ' · ' +
        step.stdout_bytes.toLocaleString() + ' bytes)';
    } else {
      append(step.id,undefined,true);
      if (!card.received) card.body.textContent = step.stdout_bytes ? 'Preview unavailable' : 'No stdout';
    }
  }
  return {cardFor,append,binary,finish};
}

async function run() {
  if (!state.workflow || state.loading || !validCommandDraft()) return;
  const control = $('run');
  const idleLabel = control.textContent;
  const buttonTimer = element('span','Running… 0.0s');
  control.disabled = true;
  control.setAttribute('aria-busy','true');
  control.replaceChildren(spinner(),buttonTimer);
  const started = performance.now();
  const path = state.path;
  const revision = state.revision;
  const current = () => path === state.path && revision === state.revision;
  const overrides = Object.keys(state.workflow.inputs || {}).flatMap(name => {
    const value = inputOverrides.get(name);
    return value === undefined ? [] : [name+'='+value];
  });
  state.results.clear();
  for (const card of $('nodes-layer').children) updateBadge(card,null);
  tab('inspect');
  notice('Running ' + path + '…');

  const result = $('results');
  const progress = element('div',undefined,'run-progress');
  const progressLabel = element('strong','Starting workflow');
  progressLabel.setAttribute('role','status');
  const progressTimer = element('span','0.0s elapsed','run-elapsed');
  progressTimer.setAttribute('aria-hidden','true');
  progress.append(progressLabel,progressTimer);
  const output = element('section',undefined,'workflow-output');
  output.hidden = true;
  const live = element('div');
  live.id = 'live-stdout';
  result.replaceChildren(progress,output,element('h3','Live step stdout'),live);
  const preview = liveOutput(live);
  function tick() {
    const now = performance.now();
    buttonTimer.textContent = 'Running… ' + elapsed(started,now);
    const running = [...state.results.values()].filter(step => step.kind === 'running');
    const first = running[0];
    const label = first ? 'Running step "' + first.id + '" (Layer ' + first.layer + ')' +
      (running.length > 1 ? ' and ' + (running.length - 1) + ' more' : '') : 'Running workflow';
    if (progressLabel.textContent !== label) progressLabel.textContent = label;
    progressTimer.textContent = elapsed(first?.started ?? started,now) + ' elapsed';
    for (const timer of $('nodes-layer').querySelectorAll('[data-step-elapsed]')) {
      const step = state.results.get(timer.dataset.stepElapsed);
      if (step?.kind === 'running') timer.textContent = elapsed(step.started,now);
    }
  }
  const ticker = setInterval(tick,100);
  try {
    await readRunEvents({...payload(),inputs:overrides,no_cache:$('no-cache').checked}, event => {
      if (!current()) return false;
      if (event.type === 'layer_started') notice('Running layer ' + event.layer + '…');
      if (event.type === 'step_started') {
        showStep({id:event.id,layer:event.layer,kind:'running',started:performance.now()});
        preview.cardFor(event.id);
        tick();
      }
      if (event.type === 'step_stdout_chunk') preview.append(event.id,Uint8Array.from(event.chunk));
      if (event.type === 'step_stdout_binary') preview.binary(event.id,event.format);
      if (event.type === 'step_finished') {
        const step = event.telemetry;
        preview.finish(step);
        showStep(step);
        tick();
      }
      if (event.type !== 'workflow_finished') return true;

      const data = event.result;
      for (const step of data.telemetry.steps) showStep(step);
      progress.hidden = true;
      output.hidden = false;
      output.append(element('h3','Workflow Output'),element('pre',data.stdout || 'No output'));
      showArtifacts(output,data.artifacts || []);
      if (!live.childElementCount) live.textContent = 'No live output';
      if (data.live_stdout_truncated) result.append(element('p','Live preview limit reached.','quiet'));
      result.append(
        element('h3','Telemetry'),
        element('p',data.telemetry.duration_ms.toFixed(2) + ' ms · ' + data.telemetry.peak_bytes.toLocaleString() + ' peak bytes'),
        element('pre',data.telemetry.steps.map(step =>
          step.id + '  ' + step.duration_ms.toFixed(2) + ' ms  ' + step.status +
          (step.ttfb_ms == null ? '' : ' · TTFB ' + step.ttfb_ms.toFixed(2) + ' ms') +
          (step.attempts > 1 ? ' · attempts=' + step.attempts : '') +
          '  (' + step.stdout_bytes + ' out / ' + step.stderr_bytes + ' err)').join('\n') || 'No steps ran.'),
        element('h3','Stderr' + (data.stderr_truncated ? ' (excerpt)' : '')),
        element('pre',cleanDiagnostics(data.stderr) || 'No diagnostics')
      );
      if (data.pid_ledger.length) {
        result.append(element('h3','PID ledger'),element('pre',data.pid_ledger.map(process =>
          process.pid + '  ' + process.step + '  ' + process.status).join('\n')));
      }
      notice(data.ok ? 'Workflow completed' : cleanDiagnostics(data.error) || 'Workflow failed',
        data.ok ? 'success' : 'error');
      return false;
    });
  } catch (error) {
    if (current()) notice(error instanceof TypeError ?
      'Studio server unreachable — make sure "stdo serve" is running' : error.message,'error');
  } finally {
    clearInterval(ticker);
    progress.hidden = true;
    for (const step of state.results.values()) {
      if (step.kind === 'running') {
        state.results.delete(step.id);
        const card = Array.from($('nodes-layer').children).find(card => card.dataset.step === step.id);
        if (card) updateBadge(card,null);
      }
    }
    control.removeAttribute('aria-busy');
    control.textContent = idleLabel;
    control.disabled = false;
  }
}

    <tr><td>pipe_mode: concurrent</td><td>Eligible producer and consumer run together.</td></tr>
    <tr><td>pipe_mode: atomic</td><td>Waits for validated, captured output and producer success. Consumer writes remain in place if the consumer later fails.</td></tr>
    <tr><td>capture_stdout: false</td><td>Streams without retaining stdout. Requires live consumers and prevents output replay or caching.</td></tr>
    <tr><td>cache: true</td><td>Reuses captured output by content key. A piped consumer needs complete stdin for its key.</td></tr>
    <tr><td>parse_stdout: json | jsonl</td><td>Validates a JSON document or JSON Lines records. Templates use steps.id.json.</td></tr></table>
    <h3>Files &amp; shortcuts</h3>
    <p>New file creates a draft. Save quickly updates a saved file. Save As chooses a workspace filename and directory. Export local copy uses the browser picker when available. Delete file removes the saved YAML. Revert changes reloads the saved file. Validate (Doctor) checks the draft without saving.</p>
    <p>Dialog shortcuts use Tab to move focus, Enter to activate a focused button, and Esc to cancel. Click outside to close this help.</p>`;
  dialog.append(content,button('Close',() => finish(true)));
}));
$('run').addEventListener('click',run);
$('apply-yaml').addEventListener('click',() => validate(true));
$('yaml').addEventListener('input',() => {
  if (!state.workflow || state.loading) return;
  state.raw = true;
  state.dirty = true;
  state.results.clear();
  updatePreview();
});
window.addEventListener('beforeunload',event => {
  if (state.dirty) { event.preventDefault(); event.returnValue = ''; }
});
setInterval(pollDisk, 1500);
start().catch(error => notice(error.message,'error'));
</script>
