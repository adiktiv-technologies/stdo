<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stdo Studio</title>
<style>
:root{color-scheme:dark;--canvas:#111827;--panel:#151d2c;--bar:#0d1422;--line:#303c51;--text:#e8edf6;--muted:#a8b5ca;--pipe:#6ee7c8;--template:#c1adff;--branch:#f4c079;--error:#ff9c9c;--mono:ui-monospace,SFMono-Regular,Consolas,monospace;font:14px system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bar);color:var(--text)}button,input,select,textarea{font:inherit;color:inherit}button,select,input,textarea{background:#1a2538;border:1px solid var(--line);border-radius:6px;padding:7px 9px}button,select{cursor:pointer}button:hover{border-color:var(--muted)}button:disabled{opacity:.5;cursor:wait}:focus-visible{outline:2px solid var(--pipe);outline-offset:2px}.primary{background:var(--pipe);color:#10251f;border-color:var(--pipe);font-weight:700}.danger{color:var(--error)}.quiet{color:var(--muted)}
#toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}.brand{font:700 20px var(--mono);margin-right:10px}.brand span{color:var(--muted);font:500 14px system-ui}.toolbar-group{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.toolbar-group:last-child{margin-left:auto}#files{max-width:245px}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,29vw);height:calc(100dvh - 64px);min-height:440px}#workspace{min-width:0;display:flex;flex-direction:column;min-height:0}.canvas-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--panel)}.canvas-bar strong{font-family:var(--mono)}.legend{display:flex;gap:10px;color:var(--muted);font-size:12px}.legend i{display:inline-block;width:10px;height:3px;margin-right:4px;vertical-align:middle;background:var(--edge)}.pipe{--edge:var(--pipe)}.template{--edge:var(--template)}.branch{--edge:var(--branch)}#viewport{flex:1;overflow:auto;background:radial-gradient(circle,#34435d 1px,transparent 1.4px) 0 0/21px 21px,var(--canvas)}
#stage{position:relative;min-width:100%;min-height:100%}#edges-layer,#nodes-layer,#layers{position:absolute;inset:0;width:100%;height:100%}#nodes-layer,#layers,#edges-layer{pointer-events:none}.layer-label{position:absolute;color:var(--muted);font:12px var(--mono);width:228px;padding-bottom:7px;border-bottom:1px solid #3c4d68}.edge{fill:none;stroke:var(--edge);stroke-width:2;opacity:.85}.edge-hit{fill:none;stroke:transparent;stroke-width:15;pointer-events:stroke;cursor:pointer}.edge-hit:hover+.edge,.edge-hit:focus+.edge{stroke:var(--error);stroke-width:3;opacity:1}.wire-preview{fill:none;stroke:var(--text);stroke-dasharray:4 5;stroke-width:2}.node{position:absolute;width:228px;height:108px;pointer-events:auto;background:#192437;border:1px solid #465775;border-radius:9px;box-shadow:0 6px 12px #060a1455}.node.selected{outline:2px solid var(--template);outline-offset:3px}.node[data-result=passed]{border-color:var(--pipe)}.node[data-result=failed]{border-color:var(--error)}.node[data-result=skipped]{opacity:.64}.node[data-result=cached]{border-color:var(--template)}.node header{cursor:grab;touch-action:none;display:flex;gap:8px;align-items:center;padding:9px 11px;border-bottom:1px solid var(--line)}.node header:active{cursor:grabbing}.node header button{margin-left:auto;padding:2px 6px;font-size:11px}.node header strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:600 13px var(--mono)}.node .kind{font:11px var(--mono);color:var(--pipe)}.node.switch .kind{color:var(--branch)}.node .summary,.node .badge{display:block;margin:8px 11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font:12px var(--mono);color:var(--muted)}.node .badge{color:var(--text);font-size:11px}.port{position:absolute;top:47px;width:13px;height:13px;padding:0;border:2px solid #182235;background:var(--pipe);border-radius:50%;cursor:crosshair}.port.in{left:-7px}.port.out{right:-7px}.port:hover{background:#fff}.port.armed{outline:2px solid var(--text)}
#yaml-panel{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-left:1px solid var(--line)}.tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--line)}.tabs button{flex:1;background:transparent}.tabs [aria-selected=true]{background:#29354a;border-color:#546485}.pane{padding:14px;overflow:auto;flex:1}.pane[hidden]{display:none}.pane h2{font-size:15px;margin:0 0 12px}.pane h3{font-size:13px;margin:16px 0 8px}.field{display:grid;gap:4px;margin:0 0 10px;color:var(--muted);font-size:12px}.field input,.field select,.field textarea{width:100%;color:var(--text);font:12px var(--mono)}.field input[type=checkbox]{width:auto;justify-self:start}.field textarea{min-height:65px;resize:vertical}.input-card{border-top:1px solid var(--line);padding-top:11px;margin-top:12px}.input-card button{font-size:12px}#yaml{display:block;width:100%;height:calc(100% - 56px);min-height:230px;resize:vertical;font:12px/1.5 var(--mono);tab-size:2}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.45 var(--mono);background:var(--bar);padding:9px;border:1px solid var(--line);border-radius:6px}#notice{min-height:35px;padding:8px 13px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);overflow-wrap:anywhere}#notice[data-tone=error]{color:var(--error)}#notice[data-tone=success]{color:var(--pipe)}
@media(max-width:820px){main{height:auto;grid-template-columns:1fr}#workspace{height:60dvh}#yaml-panel{min-height:400px;border-left:0;border-top:1px solid var(--line)}#toolbar .toolbar-group:last-child{margin-left:0}.legend{display:none}}
.node[data-result=running]{border-color:#73aaff;box-shadow:0 0 16px #73aaff66}
.node[data-result=running] .badge{color:#a8caff}
#disk-notice{color:var(--branch);padding:8px 13px;font-size:12px}
#live-stdout{max-height:240px;overflow:auto}
</style>
</head>
<body>
<header id="toolbar">
  <div class="brand">stdo <span>Studio</span></div>
  <div class="toolbar-group">
    <select id="files" aria-label="Workflow file"></select>
    <button id="new-file">New file</button><button id="delete-file" class="danger">Delete file</button>
  </div>
  <div class="toolbar-group">
    <button id="add-input">+ Input</button><button id="add-command">+ Command Step</button><button id="add-switch">+ Switch Step</button>
  </div>
  <div class="toolbar-group">
    <button id="validate">Validate (Doctor)</button><button id="save">💾 Save YAML</button><button id="run" class="primary">▶ Run Workflow</button>
  </div>
</header>
<main>
  <section id="workspace" aria-label="Workflow canvas">
    <div class="canvas-bar">
      <strong id="workflow-title">Workflow</strong>
      <div class="legend" aria-label="Connection types"><span class="pipe"><i></i>Pipe</span><span class="template"><i></i>Template</span><span class="branch"><i></i>Branch</span></div>
      <label>Wire <select id="wire-mode"><option value="pipe">Pipe</option><option value="template">Template</option><option value="branch">Switch branch</option></select></label>
      <button id="layout">Auto-layout</button>
    </div>
    <div id="viewport">
      <div id="stage">
        <div id="layers" aria-hidden="true"></div>
        <svg id="edges-layer" aria-label="Workflow connections"></svg>
        <div id="nodes-layer"></div>
      </div>
    </div>
  </section>
  <aside id="yaml-panel" aria-label="Workflow inspector">
    <nav class="tabs" aria-label="Inspector views">
      <button data-tab="edit" aria-selected="true">Edit</button><button data-tab="yaml" aria-selected="false">YAML</button><button data-tab="inspect" aria-selected="false">Run inspector</button>
    </nav>
    <section id="edit" class="pane"></section>
    <section id="yaml-view" class="pane" hidden>
      <h2>Workflow YAML</h2><button id="apply-yaml">Apply to canvas</button>
      <p class="quiet">Edit YAML directly or update it from the canvas.</p>
      <textarea id="yaml" aria-label="Workflow YAML" spellcheck="false"></textarea>
    </section>
    <section id="inspect" class="pane" hidden>
      <h2>Run workflow</h2><div id="overrides"></div>
      <label><input id="no-cache" type="checkbox"> Bypass step cache</label>
      <div id="results"><p class="quiet">Run the workflow to inspect its output and timings.</p></div>
    </section>
    <div id="disk-notice" role="status" hidden></div>
    <div id="notice" role="status" aria-live="polite">Loading workflows…</div>
  </aside>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const svgNS = 'http://www.w3.org/2000/svg';
const state = {
  workflow: null, path: '', paths: [], layers: [], positions: new Map(), pinned: new Set(), selected: null,
  dirty: false, raw: false, revision: 0, timer: null, pending: null, drag: null,
  results: new Map(), saved: false, fileRequest: 0, loading: false, diskHash: null, polling: false
};
const STEP_ID = /^[A-Za-z_][A-Za-z0-9_]*$/;
const STEP_REFERENCE = /steps\.([A-Za-z_][A-Za-z0-9_]*)\./g;
const TEMPLATE_EXPRESSION = /\{\{[\s\S]*?\}\}/g;
const NODE_WIDTH = 228;
const COLUMN = 292;
const ROW = 140;

function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  return node;
}
function button(text, action, className) {
  const node = element('button', text, className);
  node.addEventListener('click', action);
  return node;
}
function notice(text, tone = '') {
  $('notice').textContent = text;
  $('notice').dataset.tone = tone;
}
function tab(name) {
  for (const control of document.querySelectorAll('[data-tab]')) {
    const active = control.dataset.tab === name;
    control.setAttribute('aria-selected', String(active));
    $(control.dataset.tab === 'yaml' ? 'yaml-view' : control.dataset.tab).hidden = !active;
  }
}
async function api(path, method = 'GET', body) {
  const options = {method};
  if (body !== undefined) {
    options.headers = {'Content-Type': 'application/json'};
    options.body = JSON.stringify(body);
  }
  const response = await fetch(path, options);
  const result = await response.json();
  if (!response.ok) {
    const error = new Error(result.error || 'Studio request failed');
    error.status = response.status;
    throw error;
  }
  return result;
}
const fileUrl = path => '/api/workflow?path=' + encodeURIComponent(path);
const empty = () => ({version:'1.0',name:'Untitled workflow',inputs:{},steps:[]});
const payload = () => state.raw ? {yaml:$('yaml').value} : {workflow:state.workflow};

function refreshFiles() {
  $('files').replaceChildren();
  const paths = [...new Set([...state.paths, state.path].filter(Boolean))].sort();
  for (const path of paths) {
    const option = element('option', path);
    option.value = path;
    option.selected = path === state.path;
    $('files').append(option);
  }
  $('delete-file').disabled = !state.saved;
}
function replaceFile(path, data, saved) {
  state.revision++;
  clearTimeout(state.timer);
  state.path = path;
  state.workflow = data.workflow;
  state.layers = data.layers || [];
  state.positions.clear();
  state.pinned.clear();
  state.results.clear();
  state.pending = null;
  state.selected = null;
  state.raw = false;
  state.saved = saved;
  state.diskHash = saved ? data.sha256 : null;
  diskNotice('');
  state.dirty = !saved;
  $('yaml').value = data.yaml || '';
  $('results').replaceChildren(element('p', 'Run the workflow to inspect its output and timings.', 'quiet'));
  refreshFiles();
  render();
  if (saved) {
    notice(data.doctor.ok ? 'Doctor passed' : data.doctor.error, data.doctor.ok ? 'success' : 'error');
  } else {
    updatePreview();
  }
}
async function loadFile(path) {
  const request = ++state.fileRequest;
  state.loading = true;
  try {
    const data = await api(fileUrl(path));
    if (request === state.fileRequest) replaceFile(path, data, true);
  } catch (error) {
    if (request !== state.fileRequest) return;
    if (error.status === 404) replaceFile(path, {workflow:empty()}, false);
    else { refreshFiles(); notice(error.message, 'error'); }
  } finally {
    if (request === state.fileRequest) state.loading = false;
  }
}
async function start() {
  const data = await api('/api/workflows');
  state.paths = data.workflows;
  await loadFile(data.selected || 'stdo.yaml');
}
function diskNotice(message) {
  $('disk-notice').textContent = message;
  $('disk-notice').hidden = !message;
}
async function pollDisk() {
  if (!state.saved || state.loading || state.polling || $('save').disabled || $('run').disabled) return;
  state.polling = true;
  const path = state.path;
  const revision = state.revision;
  const request = state.fileRequest;
  const current = () => path === state.path && request === state.fileRequest;
  const editing = () => $('edit').contains(document.activeElement) &&
    document.activeElement.matches('input, textarea, select');
  try {
    const meta = await api('/api/workflow/meta?path=' + encodeURIComponent(path));
    if (!current()) return;
    if (meta.sha256 === state.diskHash) return diskNotice('');
    if (state.dirty || editing()) return diskNotice('This file changed on disk. Your draft is still open.');
    const data = await api(fileUrl(path));
    if (!current() || revision !== state.revision || state.dirty || editing() ||
        $('save').disabled || $('run').disabled || state.drag) return;
    replaceFile(path, data, true);
    notice('Reloaded ' + path + ' from disk' + (data.doctor.ok ? '.' : ' · ' + data.doctor.error),
      data.doctor.ok ? 'success' : 'error');
  } catch (error) {
    if (current()) diskNotice('Cannot reload from disk: ' + error.message);
  } finally {
    state.polling = false;
  }
}
function updatePreview() {
  clearTimeout(state.timer);
  const revision = ++state.revision;
  const raw = state.raw;
  const draft = payload();
  state.timer = setTimeout(async () => {
    try {
      const data = await api('/api/preview', 'POST', draft);
      if (revision !== state.revision) return;
      if (raw) {
        state.workflow = data.workflow;
        if (!state.workflow.steps.some(step => step.id === state.selected)) state.selected = null;
      } else {
        $('yaml').value = data.yaml;
      }
      updateLayout(data.layers);
      if (!state.drag) render(raw);
      notice(data.graph_error || 'Draft updated', data.graph_error ? 'error' : '');
    } catch (error) {
      if (revision === state.revision) notice(error.message, 'error');
    }
  }, 160);
}
function changed(redrawEditor = true) {
  state.raw = false;
  state.dirty = true;
  state.results.clear();
  render(redrawEditor);
  updatePreview();
}
function editAllowed() {
  if (!state.workflow || state.loading) return false;
  if (state.raw) {
    notice('Apply the YAML draft before editing the canvas.', 'error');
    tab('yaml');
    return false;
  }
  return true;
}
function currentStep(id) {
  return state.workflow.steps.find(step => step.id === id);
}
function selectStep(id) {
  state.selected = id;
  tab('edit');
  render();
}
function defaultPosition(index) {
  for (let column = 0; column < state.layers.length; column++) {
    const row = state.layers[column].indexOf(index);
    if (row !== -1) return {x:24+column*COLUMN,y:52+row*ROW};
  }
  const column = Math.max(1, state.layers.length);
  return {x:24+column*COLUMN,y:52+index*ROW};
}
function position(step, index) {
  if (!state.positions.has(step.id)) state.positions.set(step.id, defaultPosition(index));
  return state.positions.get(step.id);
}
function updateLayout(layers) {
  state.layers = layers;
  const ids = new Set(state.workflow.steps.map(step => step.id));
  for (const id of state.positions.keys()) {
    if (!ids.has(id)) state.pinned.delete(id);
    if (!state.pinned.has(id)) state.positions.delete(id);
  }
}
function placeNode(card, point) {
  card.style.transform = 'translate(' + point.x + 'px, ' + point.y + 'px)';
}
function render(redrawEditor = true) {
  if (!state.workflow) return;
  $('workflow-title').textContent = state.workflow.name || 'Untitled workflow';
  $('nodes-layer').replaceChildren();
  $('layers').replaceChildren();
  const knownLayers = state.layers.length || 1;
  for (let index = 0; index < knownLayers; index++) {
    const label = element('div', 'Layer ' + (index+1), 'layer-label');
    label.style.left = (24+index*COLUMN) + 'px';
    label.style.top = '16px';
    $('layers').append(label);
  }
  state.workflow.steps.forEach((step, index) => {
    const isSwitch = step.type === 'switch';
    const card = element('article', undefined, 'node' + (isSwitch ? ' switch' : '') + (state.selected === step.id ? ' selected' : ''));
    card.dataset.step = step.id;
    placeNode(card, position(step, index));
    const header = element('header');
    header.append(element('span', isSwitch ? '◇' : '▸', 'kind'), element('strong', step.id));
    header.append(button('Edit', () => selectStep(step.id)));
    header.addEventListener('pointerdown', event => startDrag(event, step, card));
    card.append(header, element('div', isSwitch ? step.condition || 'Set a condition' : (step.cmd || []).join(' '), 'summary'));
    updateBadge(card, state.results.get(step.id));
    for (const direction of ['in','out']) {
      const port = element('button', '', 'port ' + direction);
      port.dataset.step = step.id;
      port.setAttribute('aria-label', step.id + (direction === 'in' ? ' input port' : ' output port'));
      if (direction === 'out') {
        if (state.pending?.id === step.id) port.classList.add('armed');
        port.addEventListener('pointerdown', event => {
          event.preventDefault();
          beginWire(step.id, event);
        });
        port.addEventListener('click', event => { if (event.detail === 0) beginWire(step.id); });
      } else {
        port.addEventListener('click', () => finishWire(step.id));
      }
      card.append(port);
    }
    $('nodes-layer').append(card);
  });
  sizeStage();
  drawEdges();
  if (redrawEditor) renderEditor();
  renderOverrides();
}
function sizeStage() {
  let width = 680, height = 470;
  for (const point of state.positions.values()) {
    width = Math.max(width, point.x+NODE_WIDTH+40);
    height = Math.max(height, point.y+150);
  }
  $('stage').style.width = width + 'px';
  $('stage').style.height = height + 'px';
}
function startDrag(event, step, card) {
  if (event.target.closest('button') || event.button !== 0) return;
  event.preventDefault();
  const point = state.positions.get(step.id);
  state.pinned.add(step.id);
  state.drag = {point,card,x:event.clientX-point.x,y:event.clientY-point.y};
  event.currentTarget.setPointerCapture(event.pointerId);
}
function stagePoint(event) {
  const box = $('stage').getBoundingClientRect();
  return {x:event.clientX-box.left,y:event.clientY-box.top};
}
window.addEventListener('pointermove', event => {
  if (state.drag) {
    const {point,card,x,y} = state.drag;
    point.x = Math.max(8,event.clientX-x);
    point.y = Math.max(44,event.clientY-y);
    placeNode(card,point);
    sizeStage();
    drawEdges();
  } else if (state.pending) {
    state.pending.point = stagePoint(event);
    drawEdges();
  }
});
window.addEventListener('pointerup', event => {
  state.drag = null;
  if (!state.pending) return;
  const target = document.elementFromPoint(event.clientX,event.clientY)?.closest('.port.in');
  if (target) finishWire(target.dataset.step);
});
window.addEventListener('pointercancel', () => { state.drag = null; cancelWire(); });
window.addEventListener('keydown', event => { if (event.key === 'Escape') cancelWire(); });
function beginWire(id,event) {
  if (!editAllowed()) return;
  state.pending = {id,point:event ? stagePoint(event) : null};
  for (const port of document.querySelectorAll('.port.out')) port.classList.toggle('armed',port.dataset.step === id);
  notice('Choose an input port to connect ' + id + '. Press Esc to cancel.');
  drawEdges();
}
function cancelWire() {
  if (!state.pending) return;
  state.pending = null;
  for (const port of document.querySelectorAll('.port.armed')) port.classList.remove('armed');
  drawEdges();
}
function finishWire(targetId) {
  if (!state.pending || !editAllowed()) return;
  const source = currentStep(state.pending.id);
  const target = currentStep(targetId);
  cancelWire();
  if (!source || !target || source === target) return notice('Connect two different steps.', 'error');
  const mode = source.type === 'switch' ? 'branch' : $('wire-mode').value;
  if (mode === 'branch') {
    if (source.type !== 'switch') return notice('Branch connections start at a switch.', 'error');
    const label = prompt('Switch case value', 'true');
    if (label === null || label === '') return;
    source.cases = Object.fromEntries([...Object.entries(source.cases || {}),[label,target.id]]);
  } else if (mode === 'pipe') {
    if (target.type === 'switch') return notice('Use a template connection for a switch condition.', 'error');
    if (target.stdin && !confirm('Replace this step’s stdin template with the pipe?')) return;
    delete target.stdin;
    target.pipe_from = source.id;
  } else {
    if (!STEP_ID.test(source.id)) return notice('Use an identifier such as fetch_data for template links.', 'error');
    const reference = '{{ steps.' + source.id + '.stdout }}';
    if (target.type === 'switch') {
      if (target.condition && !confirm('Replace this switch condition with the template link?')) return;
      target.condition = reference;
    } else {
      if (target.pipe_from && !confirm('Replace this step’s pipe with a stdin template?')) return;
      delete target.pipe_from;
      target.stdin = target.stdin ? target.stdin + '\n' + reference : reference;
    }
  }
  changed();
}
function references(text) {
  return new Set(Array.from((text || '').matchAll(STEP_REFERENCE), match => match[1]));
}
function stripReference(text, id) {
  return (text || '').replace(TEMPLATE_EXPRESSION, expression => references(expression).has(id) ? '' : expression);
}
function drawEdges() {
  const layer = $('edges-layer');
  layer.replaceChildren();
  const curve = (a,b) => {
    const bend = Math.max(40,Math.abs(b.x-a.x)*.55);
    return 'M ' + a.x + ' ' + a.y + ' C ' + (a.x+bend) + ' ' + a.y + ', ' + (b.x-bend) + ' ' + b.y + ', ' + b.x + ' ' + b.y;
  };
  const path = (d,className) => {
    const line = document.createElementNS(svgNS,'path');
    line.setAttribute('d',d);
    line.setAttribute('class',className);
    return line;
  };
  function edge(from,to,kind,description,remove) {
    const a = state.positions.get(from), b = state.positions.get(to);
    if (!a || !b) return;
    const d = curve({x:a.x+NODE_WIDTH,y:a.y+54},{x:b.x,y:b.y+54});
    const hit = path(d,'edge-hit');
    hit.setAttribute('tabindex','0');
    hit.setAttribute('role','button');
    hit.setAttribute('aria-label','Delete ' + description);
    const title = document.createElementNS(svgNS,'title');
    title.textContent = description + ' · click to delete';
    hit.append(title);
    const unlink = () => { if (editAllowed()) { remove(); changed(); } };
    hit.addEventListener('click',unlink);
    hit.addEventListener('keydown',event => {
      if (['Enter',' ','Delete'].includes(event.key)) { event.preventDefault(); unlink(); }
    });
    layer.append(hit,path(d,'edge '+kind));
  }
  for (const step of state.workflow.steps) {
    if (step.pipe_from) edge(step.pipe_from,step.id,'pipe','pipe to '+step.id,() => delete step.pipe_from);
    const field = step.type === 'switch' ? 'condition' : 'stdin';
    for (const from of references(step[field])) {
      edge(from,step.id,'template','template link to '+step.id,() => { step[field] = stripReference(step[field],from); });
    }
    if (step.type === 'switch') {
      for (const [label,to] of Object.entries(step.cases || {})) {
        edge(step.id,to,'branch','case '+label+' to '+to,() => delete step.cases[label]);
      }
    }
  }
  if (state.pending?.point) {
    const start = state.positions.get(state.pending.id);
    if (start) layer.append(path(curve({x:start.x+NODE_WIDTH,y:start.y+54},state.pending.point),'wire-preview'));
  }
}
function field(label, control) {
  const wrapper = element('label', label, 'field');
  wrapper.append(control);
  return wrapper;
}
function textField(label, value, change, multiline = false) {
  const control = element(multiline ? 'textarea' : 'input');
  control.value = value ?? '';
  control.spellcheck = false;
  control.addEventListener('change', () => {
    if (editAllowed()) change(control.value);
  });
  return field(label,control);
}
function selectField(label, choices, value, change) {
  const control = element('select');
  for (const [key,title] of choices) {
    const option = element('option', title);
    option.value = key;
    option.selected = key === value;
    control.append(option);
  }
  control.addEventListener('change', () => { if (editAllowed()) change(control.value); });
  return field(label,control);
}
function toggle(label, value, change) {
  const control = element('input');
  control.type = 'checkbox';
  control.checked = Boolean(value);
  control.addEventListener('change', () => { if (editAllowed()) change(control.checked); });
  return field(label,control);
}
function jsonField(label, value, test, change, multiline = true) {
  return textField(label,value === undefined ? '' : JSON.stringify(value,null,2),text => {
    try {
      const data = text.trim() === '' ? undefined : JSON.parse(text);
      if (!test(data)) throw new Error('Check the JSON format for ' + label.toLowerCase() + '.');
      change(data);
    } catch (error) {
      notice(error.message, 'error');
    }
  },multiline);
}
function rewriteTemplates(pattern, previous, next) {
  const replace = text => text.replace(pattern,(full,id) => {
    if (id !== previous) return full;
    const prefix = full.indexOf('.') + 1;
    return full.slice(0,prefix) + next + full.slice(prefix+id.length);
  });
  for (const step of state.workflow.steps) {
    for (const key of ['stdin','condition']) if (step[key]) step[key] = replace(step[key]);
    if (step.cmd) step.cmd = step.cmd.map(replace);
  }
  if (state.workflow.output) state.workflow.output = replace(state.workflow.output);
}
function renameStep(step,id) {
  if (id === step.id) return;
  if (!STEP_ID.test(id) || currentStep(id)) {
    notice('Choose a unique step ID using letters, numbers, and underscores.', 'error');
    return;
  }
  const old = step.id;
  rewriteTemplates(STEP_REFERENCE,old,id);
  for (const other of state.workflow.steps) {
    if (other.pipe_from === old) other.pipe_from = id;
    for (const [label,target] of Object.entries(other.cases || {})) {
      if (target === old) other.cases[label] = id;
    }
  }
  const point = state.positions.get(old);
  if (state.pinned.delete(old)) state.pinned.add(id);
  state.positions.delete(old);
  if (point) state.positions.set(id,point);
  step.id = id;
  state.selected = id;
  changed();
}
function removeStep(step) {
  if (!editAllowed() || !confirm('Delete ' + step.id + ' and its connections?')) return;
  state.workflow.steps = state.workflow.steps.filter(candidate => candidate !== step);
  for (const other of state.workflow.steps) {
    if (other.pipe_from === step.id) delete other.pipe_from;
    for (const key of ['stdin','condition']) if (other[key]) other[key] = stripReference(other[key],step.id);
    if (other.cmd) other.cmd = other.cmd.map(arg => stripReference(arg,step.id));
    for (const [label,target] of Object.entries(other.cases || {})) {
      if (target === step.id) delete other.cases[label];
    }
  }
  if (state.workflow.output) state.workflow.output = stripReference(state.workflow.output,step.id);
  state.positions.delete(step.id);
  state.pinned.delete(step.id);
  state.selected = null;
  changed();
}
function renderEditor() {
  const pane = $('edit');
  pane.replaceChildren();
  const step = currentStep(state.selected);
  if (step) {
    pane.append(button('← Workflow settings', () => selectStep(null)), element('h3', 'Edit ' + step.id));
    const change = (key,value) => { step[key] = value; changed(false); };
    pane.append(textField('Step ID',step.id,id => renameStep(step,id)));
    pane.append(textField('Display name',step.name,value => change('name',value || null)));
    if (step.type === 'switch') {
      pane.append(textField('Condition template',step.condition,value => change('condition',value),true));
      pane.append(jsonField('Cases (JSON object)',step.cases,value =>
        value && typeof value === 'object' && !Array.isArray(value) && Object.values(value).every(target => typeof target === 'string'),
        value => change('cases',value)));
    } else {
      pane.append(jsonField('Command arguments (JSON array)',step.cmd,value =>
        Array.isArray(value) && value.length > 0 && value.every(arg => typeof arg === 'string'),
        value => change('cmd',value)));
      pane.append(textField('Stdin template',step.stdin,value => {
        step.stdin = value || null;
        if (value && step.pipe_from) { delete step.pipe_from; changed(); }
        else changed(false);
      },true));
      pane.append(textField('Pipe from (step ID)',step.pipe_from,value => {
        step.pipe_from = value || null;
        if (value && step.stdin) { delete step.stdin; changed(); }
        else changed(false);
      }));
      pane.append(toggle('Cache result',step.cache,value => change('cache',value)));
      pane.append(toggle('Ignore nonzero exit codes',step.ignore_exit_code,value => change('ignore_exit_code',value)));
      pane.append(selectField('Parse stdout',[['','Raw bytes'],['json','JSON'],['jsonl','JSON Lines (JSONL)']],step.parse_stdout || '',
        value => change('parse_stdout',value || null)));
    }
    pane.append(button('Delete step', () => removeStep(step), 'danger'));
    return;
  }
  const workflow = state.workflow;
  pane.append(element('h2','Workflow settings'));
  const change = (key,value) => { workflow[key] = value; changed(false); };
  pane.append(textField('Workflow name',workflow.name,value => change('name',value)));
  pane.append(textField('Description',workflow.description,value => change('description',value || null),true));
  pane.append(textField('Output template',workflow.output,value => change('output',value || null),true));
  pane.append(element('h3','Inputs'));
  for (const [name,input] of Object.entries(workflow.inputs || {})) {
    const group = element('div',undefined,'input-card');
    const update = (key,value) => { input[key] = value; changed(false); };
    group.append(textField('Input name',name,next => {
      if (next === name) return;
      if (!STEP_ID.test(next) || Object.hasOwn(workflow.inputs,next)) {
        notice('Choose a unique input name using letters, numbers, and underscores.', 'error');
        return;
      }
      workflow.inputs = Object.fromEntries(Object.entries(workflow.inputs).map(([key,value]) => [key === name ? next : key,value]));
      rewriteTemplates(/inputs\.([A-Za-z_][A-Za-z0-9_]*)\b/g,name,next);
      changed();
    }));
    group.append(selectField('Type',['string','path','enum','number','boolean'].map(type => [type,type]),input.type,
      value => { input.type = value; changed(); }));
    group.append(jsonField('Default (JSON value)',input.default ?? undefined,
      value => value === undefined || ['string','number','boolean'].includes(typeof value),
      value => update('default',value ?? null),false));
    group.append(textField('Description',input.description,value => update('description',value || null)));
    if (input.type === 'enum') {
      group.append(textField('Allowed values (one per line)',(input.values || []).join('\n'),
        value => update('values',value.split('\n').filter(Boolean)),true));
    }
    group.append(button('Delete input',() => {
      if (!editAllowed()) return;
      delete workflow.inputs[name];
      changed();
    },'danger'));
    pane.append(group);
  }
}
const inputOverrides = new Map();
function renderOverrides() {
  const pane = $('overrides');
  pane.replaceChildren();
  for (const [name,input] of Object.entries(state.workflow.inputs || {})) {
    const control = element('input');
    control.value = inputOverrides.get(name) || '';
    control.placeholder = input.default === null || input.default === undefined ? 'Override ' + name : String(input.default);
    control.addEventListener('input',() => inputOverrides.set(name,control.value));
    const reset = button('Use default',() => {
      inputOverrides.delete(name);
      control.value = '';
    });
    const group = field(name,control);
    group.append(reset);
    pane.append(group);
  }
}
function addStep(kind) {
  if (!editAllowed()) return;
  let number = 1;
  while (currentStep(kind + '_' + number)) number++;
  const id = kind + '_' + number;
  state.workflow.steps.push(kind === 'switch'
    ? {id,type:'switch',condition:'true',cases:{}}
    : {id,cmd:['echo','Hello from stdo']});
  state.selected = id;
  tab('edit');
  changed();
}
function addInput() {
  if (!editAllowed()) return;
  const inputs = state.workflow.inputs ||= {};
  let number = 1;
  while (Object.hasOwn(inputs,'input_' + number)) number++;
  inputs['input_' + number] = {type:'string',default:''};
  state.selected = null;
  tab('edit');
  changed();
}
function applyPreview(data) {
  state.workflow = data.workflow;
  updateLayout(data.layers);
  state.raw = false;
  $('yaml').value = data.yaml;
  render();
}
function discardDraft() {
  return !state.dirty || confirm('Discard the unsaved workflow changes?');
}
async function save() {
  if (!state.workflow || state.loading) return;
  if (!$('disk-notice').hidden && !confirm('Replace the externally changed file with this draft?')) return;
  const control = $('save');
  control.disabled = true;
  const path = state.path;
  const revision = state.revision;
  try {
    const data = await api('/api/workflow','POST',{path,...payload()});
    if (!state.paths.includes(path)) state.paths.push(path);
    if (path === state.path && revision === state.revision) {
      clearTimeout(state.timer);
      state.revision++;
      applyPreview(data);
      state.saved = true;
      state.diskHash = data.sha256;
      diskNotice('');
      state.dirty = false;
      notice(data.doctor.ok ? 'Saved ' + path : 'Saved. Doctor: ' + data.doctor.error,
        data.doctor.ok ? 'success' : 'error');
    }
    refreshFiles();
  } catch (error) { notice(error.message,'error'); }
  finally { control.disabled = false; }
}
async function validate(apply = false) {
  if (!state.workflow || state.loading) return;
  const revision = state.revision;
  try {
    const data = await api('/api/preview','POST',payload());
    if (revision !== state.revision) return;
    if (apply) {
      clearTimeout(state.timer);
      state.revision++;
      applyPreview(data);
    }
    notice(data.doctor.ok ? 'Doctor passed' : data.doctor.error, data.doctor.ok ? 'success' : 'error');
  } catch (error) { notice(error.message,'error'); }
}
function updateBadge(card, result) {
  card.querySelector('.badge')?.remove();
  if (!result) {
    delete card.dataset.result;
    return;
  }
  card.dataset.result = result.kind === 'running' ? 'running' : result.cache_hit ? 'cached' :
    ['skipped','cancelled'].includes(result.kind) ? 'skipped' :
      result.kind === 'failed' || (result.kind === 'exit' && result.exit_code !== 0) ? 'failed' : 'passed';
  const text = result.kind === 'running' ? 'running…' :
    result.duration_ms.toFixed(2) + ' ms · ' + result.status +
      (result.ttfb_ms == null ? '' : ' · TTFB ' + result.ttfb_ms.toFixed(2) + ' ms');
  const badge = element('span',text,'badge');
  badge.title = text;
  card.append(badge);
}
function showStep(result) {
  state.results.set(result.id,result);
  const card = Array.from($('nodes-layer').children).find(card => card.dataset.step === result.id);
  if (card) updateBadge(card,result);
}

async function readRunEvents(body, consume) {
  const response = await fetch('/api/run/stream',{
    method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)
  });
  if (!response.ok) {
    const data = await response.json();
    throw new Error(data.error || 'Studio run request failed');
  }
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let pending = '';
  try {
    for (;;) {
      const {value,done} = await reader.read();
      pending += decoder.decode(value,{stream:!done});
      let boundary;
      while ((boundary = pending.indexOf('\n\n')) !== -1) {
        const frame = pending.slice(0,boundary);
        pending = pending.slice(boundary+2);
        if (frame.startsWith('data: ') && !consume(JSON.parse(frame.slice(6)))) return;
      }
      if (done) throw new Error('The execution stream closed before the final result.');
    }
  } finally {
    await reader.cancel().catch(() => {});
  }
}

async function run() {
  if (!state.workflow || state.loading) return;
  const control = $('run');
  control.disabled = true;
  const path = state.path;
  const revision = state.revision;
  const current = () => path === state.path && revision === state.revision;
  const overrides = Object.keys(state.workflow.inputs || {}).flatMap(name => {
    const value = inputOverrides.get(name);
    return value === undefined ? [] : [name+'='+value];
  });
  state.results.clear();
  for (const card of $('nodes-layer').children) updateBadge(card,null);
  tab('inspect');
  notice('Running ' + path + '…');

  const result = $('results');
  const live = element('pre','Waiting for output…');
  live.id = 'live-stdout';
  result.replaceChildren(element('h3','Live step stdout'),live);
  const decoders = new Map();
  let lastStep = null;
  function appendChunk(id, bytes, done = false) {
    if (!decoders.has(id)) decoders.set(id,new TextDecoder());
    const text = decoders.get(id).decode(bytes,{stream:!done});
    if (!text) return;
    if (lastStep === null) live.textContent = '';
    if (lastStep !== id) live.append((lastStep === null ? '' : '\n') + '[' + id + ']\n');
    live.append(text);
    lastStep = id;
    live.scrollTop = live.scrollHeight;
  }
  try {
    await readRunEvents({...payload(),inputs:overrides,no_cache:$('no-cache').checked}, event => {
      if (!current()) return false;
      if (event.type === 'layer_started') notice('Running layer ' + event.layer + '…');
      if (event.type === 'step_started') showStep({id:event.id,kind:'running'});
      if (event.type === 'step_stdout_chunk') appendChunk(event.id,Uint8Array.from(event.chunk));
      if (event.type === 'step_finished') {
        const step = event.telemetry;
        if (decoders.has(step.id)) appendChunk(step.id,undefined,true);
        showStep(step);
      }
      if (event.type !== 'workflow_finished') return true;

      const data = event.result;
      for (const step of data.telemetry.steps) showStep(step);
      if (lastStep === null) live.textContent = 'No live output';
      if (data.live_stdout_truncated) result.append(element('p','Live preview limit reached.','quiet'));
      result.append(
        element('h3','Telemetry'),
        element('p',data.telemetry.duration_ms.toFixed(2) + ' ms · ' + data.telemetry.peak_bytes.toLocaleString() + ' peak bytes'),
        element('pre',data.telemetry.steps.map(step =>
          step.id + '  ' + step.duration_ms.toFixed(2) + ' ms  ' + step.status +
          (step.ttfb_ms == null ? '' : ' · TTFB ' + step.ttfb_ms.toFixed(2) + ' ms') +
          '  (' + step.stdout_bytes + ' out / ' + step.stderr_bytes + ' err)').join('\n') || 'No steps ran.'),
        element('h3','Workflow stdout'),element('pre',data.stdout || 'No output'),
        element('h3','Stderr' + (data.stderr_truncated ? ' (excerpt)' : '')),element('pre',data.stderr || 'No diagnostics')
      );
      if (data.pid_ledger.length) {
        result.append(element('h3','PID ledger'),element('pre',data.pid_ledger.map(process =>
          process.pid + '  ' + process.step + '  ' + process.status).join('\n')));
      }
      notice(data.ok ? 'Workflow completed' : data.error, data.ok ? 'success' : 'error');
      return false;
    });
  } catch (error) {
    if (current()) {
      for (const step of state.results.values()) {
        if (step.kind === 'running') {
          state.results.delete(step.id);
          const card = Array.from($('nodes-layer').children).find(card => card.dataset.step === step.id);
          if (card) updateBadge(card,null);
        }
      }
      notice(error.message,'error');
    }
  } finally { control.disabled = false; }
}

for (const control of document.querySelectorAll('[data-tab]')) {
  control.addEventListener('click',() => tab(control.dataset.tab));
}
$('files').addEventListener('change',event => {
  if (!discardDraft()) { refreshFiles(); return; }
  inputOverrides.clear();
  loadFile(event.target.value);
});
$('new-file').addEventListener('click',() => {
  if (!discardDraft()) return;
  const path = prompt('Workflow file path', 'new-workflow.yaml');
  if (!path) return;
  inputOverrides.clear();
  loadFile(path);
});
$('delete-file').addEventListener('click',async () => {
  const path = state.path;
  if (!state.saved || !confirm('Delete ' + path + ' from disk?')) return;
  try {
    await api(fileUrl(path),'DELETE');
    state.paths = state.paths.filter(candidate => candidate !== path);
    inputOverrides.clear();
    await loadFile(state.paths[0] || 'stdo.yaml');
  } catch (error) { notice(error.message,'error'); }
});
$('layout').addEventListener('click',() => {
  state.pinned.clear();
  state.positions.clear();
  render();
});
$('add-input').addEventListener('click',addInput);
$('add-command').addEventListener('click',() => addStep('command'));
$('add-switch').addEventListener('click',() => addStep('switch'));
$('validate').addEventListener('click',() => validate());
$('save').addEventListener('click',save);
$('run').addEventListener('click',run);
$('apply-yaml').addEventListener('click',() => validate(true));
$('yaml').addEventListener('input',() => {
  if (!state.workflow || state.loading) return;
  state.raw = true;
  state.dirty = true;
  state.results.clear();
  updatePreview();
});
window.addEventListener('beforeunload',event => {
  if (state.dirty) { event.preventDefault(); event.returnValue = ''; }
});
setInterval(pollDisk, 1500);
start().catch(error => notice(error.message,'error'));
</script>
</body>
